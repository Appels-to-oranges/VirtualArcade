<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stats - Virtual Arcade</title>
  <meta name="description" content="View your game statistics, win rates, and chip history on Virtual Arcade.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
      gap: 0.3rem;
      margin-bottom: 0.6rem;
    }
    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 0.0625rem solid #2c3a4a;
      border-radius: 0.18rem;
      padding: 0.3rem;
      text-align: center;
    }
    .stat-card .stat-value {
      font-size: 0.55rem;
      font-weight: 700;
      color: #f0d78c;
    }
    .stat-card .stat-label {
      font-size: 0.24rem;
      color: #8a9bb0;
      margin-top: 0.08rem;
    }
    .chart-box {
      background: rgba(18, 24, 32, 0.94);
      border: 0.0625rem solid #2c3a4a;
      border-radius: 0.18rem;
      padding: 0.3rem;
      margin-bottom: 0.5rem;
    }
    .chart-box .highcharts-container { width: 100% !important; }
    .chart-title {
      font-size: 0.36rem;
      color: #cdd7e2;
      margin-bottom: 0.25rem;
    }
    .game-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.28rem;
      margin-bottom: 0.5rem;
    }
    .game-table th, .game-table td {
      padding: 0.18rem 0.25rem;
      text-align: left;
      border-bottom: 0.0625rem solid #2c3a4a;
    }
    .game-table th { color: #8a9bb0; font-weight: 600; }
    .game-table td { color: #cdd7e2; }
    .game-table .pos { color: #6fcf6f; }
    .game-table .neg { color: #e06060; }
    .game-table .zero { color: #8a9bb0; }
    .recent-list { list-style: none; padding: 0; margin: 0; }
    .recent-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.15rem 0.2rem;
      font-size: 0.26rem;
      color: #cdd7e2;
      border-bottom: 0.0625rem solid rgba(44,58,74,0.5);
    }
    .recent-list .badge {
      display: inline-block;
      padding: 0.04rem 0.14rem;
      border-radius: 0.08rem;
      font-size: 0.22rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-win { background: rgba(111,207,111,0.15); color: #6fcf6f; }
    .badge-loss { background: rgba(224,96,96,0.15); color: #e06060; }
    .badge-push { background: rgba(138,155,176,0.15); color: #8a9bb0; }
    .badge-fold { background: rgba(200,180,120,0.15); color: #c8b478; }
    .stats-login-msg {
      text-align: center;
      padding: 1.5rem 0.5rem;
      color: #8a9bb0;
      font-size: 0.36rem;
    }
    .stats-login-msg a { color: #9cc5ff; }
  </style>
</head>
<body class="info-page">
  <main class="info-shell" style="max-width:52rem;">
    <section class="info-card">
      <nav class="info-top-links" aria-label="Site links">
        <a href="/">Home</a>
        <a href="/how-to-play.html">How to Play</a>
        <a href="/about.html">About</a>
      </nav>
      <h1 class="info-title">My Stats</h1>

      <div id="stats-content">
        <p class="stats-login-msg">Loading...</p>
      </div>
    </section>
  </main>

  <script>
    const GAME_LABELS = { holdem: "Texas Hold'em", blackjack: 'Blackjack', slots: 'Slots', checkers: 'Checkers', chess: 'Chess' };
    const HC_BG = 'transparent';
    const HC_TEXT = '#cdd7e2';
    const HC_LINE = '#2c3a4a';

    Highcharts.setOptions({
      chart: { backgroundColor: HC_BG, style: { fontFamily: 'inherit' } },
      title: { style: { color: HC_TEXT, fontSize: '14px' } },
      xAxis: { lineColor: HC_LINE, tickColor: HC_LINE, labels: { style: { color: '#8a9bb0' } } },
      yAxis: { gridLineColor: HC_LINE, labels: { style: { color: '#8a9bb0' } }, title: { style: { color: '#8a9bb0' } } },
      legend: { itemStyle: { color: HC_TEXT }, itemHoverStyle: { color: '#fff' } },
      credits: { enabled: false },
      tooltip: { backgroundColor: '#1a2332', borderColor: '#2c3a4a', style: { color: HC_TEXT } },
    });

    (async () => {
      const el = document.getElementById('stats-content');
      let data;
      try {
        const resp = await fetch('/api/stats', { credentials: 'same-origin' });
        if (resp.status === 401) {
          el.innerHTML = '<p class="stats-login-msg">You need to <a href="/">log in</a> to view your stats.</p>';
          return;
        }
        data = await resp.json();
        if (data.error) throw new Error(data.error);
      } catch (e) {
        el.innerHTML = '<p class="stats-login-msg">Failed to load stats.</p>';
        return;
      }

      const totalGames = data.summary.reduce((s, r) => s + r.total, 0);
      const totalWins = data.summary.reduce((s, r) => s + r.wins, 0);
      const totalLosses = data.summary.reduce((s, r) => s + r.losses, 0);
      const totalNet = data.summary.reduce((s, r) => s + r.net_chips, 0);
      const winRate = totalGames ? ((totalWins / totalGames) * 100).toFixed(1) : '0.0';
      const memberSince = new Date(data.createdAt).toLocaleDateString();

      let html = '';

      // Overview cards
      html += '<div class="stats-grid">';
      html += card(data.chips, 'Current Chips');
      html += card(totalGames, 'Games Played');
      html += card(totalWins, 'Wins');
      html += card(totalLosses, 'Losses');
      html += card(winRate + '%', 'Win Rate');
      html += card(fmtChips(totalNet), 'Net Chips');
      html += card(data.chessBestLevel || '-', 'Best Chess AI');
      html += card(memberSince, 'Member Since');
      html += '</div>';

      // Per-game table
      html += '<div class="chart-box"><p class="chart-title">By Game</p>';
      html += '<table class="game-table"><thead><tr><th>Game</th><th>Played</th><th>W</th><th>L</th><th>Win%</th><th>Net</th></tr></thead><tbody>';
      for (const r of data.summary) {
        const wr = r.total ? ((r.wins / r.total) * 100).toFixed(1) : '0.0';
        const cls = r.net_chips > 0 ? 'pos' : r.net_chips < 0 ? 'neg' : 'zero';
        html += '<tr><td>' + (GAME_LABELS[r.game_type] || r.game_type) + '</td><td>' + r.total + '</td><td>' + r.wins + '</td><td>' + r.losses + '</td><td>' + wr + '%</td><td class="' + cls + '">' + fmtChips(r.net_chips) + '</td></tr>';
      }
      if (!data.summary.length) html += '<tr><td colspan="6" style="color:#8a9bb0;text-align:center;">No games played yet</td></tr>';
      html += '</tbody></table></div>';

      // Chart containers
      html += '<div class="chart-box"><p class="chart-title">Chip Balance Over Time</p><div id="chart-chips" style="height:280px;"></div></div>';
      html += '<div class="chart-box"><p class="chart-title">Win Rate by Game</p><div id="chart-winrate" style="height:280px;"></div></div>';
      html += '<div class="chart-box"><p class="chart-title">Games Played by Type</p><div id="chart-pie" style="height:280px;"></div></div>';

      // Recent games
      html += '<div class="chart-box"><p class="chart-title">Recent Games</p><ul class="recent-list">';
      for (const g of data.recent) {
        const badge = g.result === 'win' ? 'badge-win' : g.result === 'loss' ? 'badge-loss' : g.result === 'fold' ? 'badge-fold' : 'badge-push';
        const time = new Date(g.played_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        const cls = g.chips_change > 0 ? 'pos' : g.chips_change < 0 ? 'neg' : 'zero';
        html += '<li><span><span class="badge ' + badge + '">' + g.result + '</span> ' + (GAME_LABELS[g.game_type] || g.game_type) + '</span><span><span class="' + cls + '">' + fmtChips(g.chips_change) + '</span> &middot; ' + time + '</span></li>';
      }
      if (!data.recent.length) html += '<li style="color:#8a9bb0;justify-content:center;">No games yet</li>';
      html += '</ul></div>';

      el.innerHTML = html;

      // Chip balance chart
      if (data.history.length) {
        const pts = data.history.map(h => [new Date(h.played_at).getTime(), h.chips_after]);
        Highcharts.chart('chart-chips', {
          chart: { type: 'area', zooming: { type: 'x' } },
          title: { text: null },
          xAxis: { type: 'datetime' },
          yAxis: { title: { text: 'Chips' }, min: 0 },
          series: [{ name: 'Chips', data: pts, color: '#f0d78c', fillColor: { linearGradient: { x1:0,y1:0,x2:0,y2:1 }, stops: [[0,'rgba(240,215,140,0.25)'],[1,'rgba(240,215,140,0)']] }, marker: { enabled: false } }],
          legend: { enabled: false },
        });
      }

      // Win rate bar chart
      if (data.summary.length) {
        const cats = data.summary.map(r => GAME_LABELS[r.game_type] || r.game_type);
        const wrs = data.summary.map(r => r.total ? +((r.wins / r.total) * 100).toFixed(1) : 0);
        Highcharts.chart('chart-winrate', {
          chart: { type: 'bar' },
          title: { text: null },
          xAxis: { categories: cats },
          yAxis: { title: { text: 'Win %' }, max: 100, min: 0 },
          series: [{ name: 'Win Rate', data: wrs, color: '#6fcf6f' }],
          legend: { enabled: false },
          plotOptions: { bar: { borderRadius: 3, dataLabels: { enabled: true, format: '{y}%', style: { color: HC_TEXT, textOutline: 'none' } } } },
        });
      }

      // Pie chart
      if (data.summary.length) {
        const colors = ['#f0d78c','#6fcf6f','#e06060','#9cc5ff','#c8b478'];
        Highcharts.chart('chart-pie', {
          chart: { type: 'pie' },
          title: { text: null },
          series: [{ name: 'Games', data: data.summary.map((r,i) => ({ name: GAME_LABELS[r.game_type] || r.game_type, y: r.total, color: colors[i % colors.length] })) }],
          plotOptions: { pie: { borderColor: '#2c3a4a', dataLabels: { color: HC_TEXT, style: { textOutline: 'none' } } } },
        });
      }

      function card(val, label) {
        return '<div class="stat-card"><div class="stat-value">' + val + '</div><div class="stat-label">' + label + '</div></div>';
      }
      function fmtChips(n) {
        return n > 0 ? '+' + n : '' + n;
      }
    })();
  </script>
</body>
</html>
